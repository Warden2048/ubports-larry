# oFono RIL configuration for OnePlus Nord N30 5G (larry)
# Android 16 vendor exposes android.hardware.radio@1.5::IRadio as slot1/slot2
# (qcrild + qcrild2, persist.radio.multisim.config=dsds), so talk to it over binder.

[Settings]
SetRadioCapability=off
emptyPinQuery=false
radioPowerCycle=false
confirmRadioPowerOn=false

[ril_0]
transport=binder:name=slot1
name=slot1

[ril_1]
transport=binder:name=slot2
name=slot2
